<div class="relative">
  <input
    #cityInput
    type="text"
    [name]="name()"
    [value]="term()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    (input)="onInput(cityInput.value)"
    (focus)="onFocus()"
    (blur)="onBlur()"
    class="w-full rounded-lg border border-slate-200 bg-white px-4 pr-8 text-sm text-slate-800 shadow-sm outline-none transition focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 disabled:cursor-not-allowed disabled:bg-slate-50 disabled:text-slate-400"
    [class.py-3]="size() === 'lg'"
    [class.py-2]="size() !== 'lg'"
  />

  @if (term() && !disabled()) {
    <button
      type="button"
      (mousedown)="$event.preventDefault()"
      (click)="clear()"
      class="absolute right-2 top-1/2 -translate-y-1/2 text-lg leading-none text-indigo-400 transition hover:text-indigo-600"
      aria-label="Eingabe löschen"
    >
      ✕
    </button>
  }

  @if (open() && suggestions().length > 0) {
    <ul
      class="absolute left-0 top-full z-20 mt-1 max-h-64 w-64 overflow-auto rounded-lg border border-slate-200 bg-white py-1 shadow-lg"
    >
      @for (city of suggestions(); track city.name) {
        <li>
          <button
            type="button"
            (click)="select(city)"
            class="flex w-full items-center justify-between gap-3 px-4 py-2 text-left text-sm text-slate-700 transition hover:bg-indigo-50"
          >
            <span class="truncate">{{ city.name }}</span>
            <span class="shrink-0 whitespace-nowrap text-xs text-slate-400">{{ city.state }}</span>
          </button>
        </li>
      }
    </ul>
  }
</div>
