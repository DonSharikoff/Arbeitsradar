<header class="sticky top-0 z-10 border-b border-slate-200 bg-white/90 backdrop-blur">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
    <a routerLink="/" class="text-lg font-semibold text-slate-900">Arbeitsradar</a>
    <nav class="flex items-center gap-5 text-sm font-medium text-slate-600">
      <a
        routerLink="/"
        routerLinkActive="text-indigo-600"
        [routerLinkActiveOptions]="{ exact: true }"
        class="transition hover:text-indigo-600"
      >
        Home
      </a>
      <a routerLink="/vacancies" routerLinkActive="text-indigo-600" class="transition hover:text-indigo-600">
        Stellenangebote
      </a>
    </nav>
  </div>
</header>

<router-outlet />

<footer class="border-t border-slate-200 bg-white px-6 py-8">
  <div class="mx-auto flex max-w-6xl flex-col items-center justify-between gap-2 text-xs text-slate-400 sm:flex-row">
    <span>© 2026 Arbeitsradar — Portfolio-Projekt</span>
    <span>Daten: Bundesagentur für Arbeit (Jobsuche, BERUFENET)</span>
  </div>
</footer>
